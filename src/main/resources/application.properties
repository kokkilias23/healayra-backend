spring.application.name=healayra-backend

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/healayra}
spring.datasource.username=${DB_USERNAME:healayra_user}
spring.datasource.password=${DB_PASSWORD:healayra_pass}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true

# Actuator
management.endpoints.web.exposure.include=health,info

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}